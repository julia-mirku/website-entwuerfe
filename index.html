<style>
:root{--bg:#f4f4f1;--fg:#1d1f22;--muted:#5a5f67;--line:#c9ccd1;--on:#1d1f22;--on-fg:#fff;--card:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--fg:#ececec;--muted:#a3a7ad;--line:#3a3d42;--on:#ececec;--on-fg:#17181a;--card:#222428;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--fg:#ececec;--muted:#a3a7ad;--line:#3a3d42;--on:#ececec;--on-fg:#17181a;--card:#222428;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
.bar{flex:none;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
.bar button{flex:none;min-height:40px;padding:0 16px;border:2px solid var(--on);border-radius:999px;background:transparent;color:var(--fg);font:600 14px/1 inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.bar button[aria-pressed="true"]{background:var(--on);color:var(--on-fg)}
.bar button:focus-visible{outline:3px solid #2a6fdb;outline-offset:2px}
.bar .solo{flex:none;display:flex;align-items:center;gap:8px;margin-left:10px;padding-left:14px;border-left:2px solid var(--line)}
.bar .solo small{font:600 11px/1 inherit;font-family:inherit;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.bar .solo button{border-style:dashed}
.bar .solo button[aria-pressed="true"]{border-style:solid}
iframe{flex:1 1 auto;width:100%;min-height:0;border:0;background:#fff}
</style>

<iframe id="view" title="Сайт" translate="no"></iframe>
<script>
(function(){
  var f=document.getElementById('view'),bs=[].slice.call(document.querySelectorAll('.bar button'));
  function show(k){
    var b=bs.filter(function(x){return x.dataset.k===k})[0]||bs[0];
    bs.forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});
    var u=b.dataset.src;
    f.src=u+(u.indexOf('?')<0?'?':'&')+'t='+Date.now();
    try{history.replaceState(null,'','#'+b.dataset.k)}catch(e){}
  }
  bs.forEach(function(b){b.addEventListener('click',function(){show(b.dataset.k)})});
  show((location.hash||'').slice(1));
})();
</script>
